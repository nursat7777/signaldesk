AWSTemplateFormatVersion: '2010-09-09'
Description: SignalDesk single-host Compose coursework deployment. Review costs before
  creating; data volume retained. No HA claim.
Parameters:
  AppImage:
    Type: String
    AllowedPattern: '[a-z0-9./:_-]+@sha256:[a-f0-9]{64}'
    Description: Pullable immutable production image URI; build and publish only after
      CI passes.
  Domain:
    Type: String
    AllowedPattern: '[a-z0-9.-]+'
    Description: Existing DNS name pointing at the instance; required for HTTPS.
  ConfigSecretArn:
    Type: String
    AllowedPattern: arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+
    Description: 'Existing JSON secret: POSTGRES_PASSWORD (URL-safe), GOOGLE_CLIENT_ID,
      GOOGLE_CLIENT_SECRET, BOOTSTRAP_ADMIN_EMAIL.'
  BudgetEmail:
    Type: String
    AllowedPattern: '[^@\s]+@[^@\s]+\.[^@\s]+'
    Description: Owner-provided budget alert recipient.
  MonthlyBudgetUSD:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 20
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.43.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
  Gateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId:
        Ref: Vpc
      InternetGatewayId:
        Ref: Gateway
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock: 10.43.1.0/24
      AvailabilityZone:
        Fn::Select:
        - 0
        - Fn::GetAZs: ''
      MapPublicIpOnLaunch: true
  Routes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: Vpc
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId:
        Ref: Routes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId:
        Ref: Gateway
  RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: Subnet
      RouteTableId:
        Ref: Routes
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS and ACME only; no SSH or PostgreSQL public port
      VpcId:
        Ref: Vpc
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 80
        ToPort: 80
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: 0.0.0.0/0
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ec2.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
      - PolicyName: ReadOnlyApplicationConfiguration
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource:
              Ref: ConfigSecretArn
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            - logs:DescribeLogStreams
            Resource:
              Fn::GetAtt:
              - Logs
              - Arn
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
      - Ref: InstanceRole
  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone:
        Fn::GetAtt:
        - Subnet
        - AvailabilityZone
      Size: 8
      VolumeType: gp3
      Encrypted: true
  DataAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId:
        Ref: Instance
      VolumeId:
        Ref: DataVolume
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount:
            Ref: MonthlyBudgetUSD
          Unit: USD
      NotificationsWithSubscribers:
      - Notification:
          NotificationType: ACTUAL
          ComparisonOperator: GREATER_THAN
          Threshold: 50
          ThresholdType: PERCENTAGE
        Subscribers:
        - SubscriptionType: EMAIL
          Address:
            Ref: BudgetEmail
      - Notification:
          NotificationType: ACTUAL
          ComparisonOperator: GREATER_THAN
          Threshold: 80
          ThresholdType: PERCENTAGE
        Subscribers:
        - SubscriptionType: EMAIL
          Address:
            Ref: BudgetEmail
      - Notification:
          NotificationType: ACTUAL
          ComparisonOperator: GREATER_THAN
          Threshold: 100
          ThresholdType: PERCENTAGE
        Subscribers:
        - SubscriptionType: EMAIL
          Address:
            Ref: BudgetEmail
  Instance:
    Type: AWS::EC2::Instance
    DependsOn:
    - DefaultRoute
    - RouteAssociation
    Properties:
      ImageId:
        Ref: AmiId
      InstanceType: t3.micro
      CreditSpecification:
        CPUCredits: standard
      IamInstanceProfile:
        Ref: InstanceProfile
      SubnetId:
        Ref: Subnet
      SecurityGroupIds:
      - Ref: SecurityGroup
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
      - DeviceName: /dev/xvda
        Ebs:
          VolumeSize: 8
          VolumeType: gp3
          Encrypted: true
          DeleteOnTermination: true
      UserData:
        Fn::Base64:
          Fn::Sub: "#!/bin/bash\nset -eu\n# Do not enable shell tracing: runtime configuration\
            \ contains secrets.\ndnf install -y docker\nsystemctl enable --now docker\n\
            curl -fsSL https://github.com/docker/compose/releases/download/v2.40.3/docker-compose-linux-x86_64\
            \ -o /usr/local/bin/docker-compose\nchmod 755 /usr/local/bin/docker-compose\n\
            mkdir -p /srv/signaldesk\nVOLUME_ID='${DataVolume}'\nDEVICE=/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_$(echo\
            \ \"$VOLUME_ID\" | tr -d '-')\nfor n in $(seq 1 120); do [ -b \"$DEVICE\"\
            \ ] && break; [ -b /dev/xvdf ] && DEVICE=/dev/xvdf && break; sleep 2;\
            \ done\n[ -b \"$DEVICE\" ] || exit 1\n# Format only a new blank volume.\
            \ Existing filesystem is preserved.\nblkid \"$DEVICE\" >/dev/null 2>&1\
            \ || mkfs.ext4 \"$DEVICE\"\nmount \"$DEVICE\" /srv/signaldesk\nprintf\
            \ 'UUID=%s /srv/signaldesk ext4 defaults,nofail 0 2\\n' \"$(blkid -s UUID\
            \ -o value \"$DEVICE\")\" >> /etc/fstab\nmkdir -p /srv/signaldesk/postgres\
            \ /srv/signaldesk/caddy\ncd /srv/signaldesk\numask 077\naws secretsmanager\
            \ get-secret-value --region '${AWS::Region}' --secret-id '${ConfigSecretArn}'\
            \ --query SecretString --output text > /run/signaldesk-config.json\npython3\
            \ - <<'ENVFILE'\nimport json,re\nfrom pathlib import Path\nc=json.loads(Path('/run/signaldesk-config.json').read_text())\n\
            assert re.fullmatch('[A-Za-z0-9_-]{24,}',c['POSTGRES_PASSWORD'])\nkeys=('POSTGRES_PASSWORD','GOOGLE_CLIENT_ID','GOOGLE_CLIENT_SECRET','BOOTSTRAP_ADMIN_EMAIL')\n\
            with open('.env','w') as f:\n    for key in keys:\n        value=c.get(key,'')\n\
            \        assert '\\n' not in value and '\\r' not in value and \"'\" not\
            \ in value\n        f.write(key+\"='\"+value+\"'\\n\")\nENVFILE\nrm /run/signaldesk-config.json\n\
            cat > Caddyfile <<'CADDY'\n${Domain} {\n  reverse_proxy app:8000\n}\n\
            CADDY\ncat > compose.yaml <<'COMPOSE'\nservices:\n  app:\n    image: ${AppImage}\n\
            \    env_file: .env\n    environment:\n      DATABASE_URL: postgresql+psycopg://signaldesk:$POSTGRES_PASSWORD@db/signaldesk\n\
            \      FRONTEND_URL: https://${Domain}\n      ALLOWED_ORIGINS: https://${Domain}\n\
            \      GOOGLE_REDIRECT_URI: https://${Domain}/api/auth/google/callback\n\
            \      FORWARDED_ALLOW_IPS: '*'\n    depends_on:\n      db:\n        condition:\
            \ service_healthy\n    restart: unless-stopped\n    read_only: true\n\
            \    tmpfs: [/tmp]\n    cap_drop: [ALL]\n    security_opt: [no-new-privileges:true]\n\
            \    mem_limit: 384m\n    logging:\n      driver: awslogs\n      options:\n\
            \        awslogs-region: ${AWS::Region}\n        awslogs-group: ${Logs}\n\
            \        awslogs-stream: app\n  db:\n    image: postgres:16-alpine\n \
            \   env_file: .env\n    environment:\n      POSTGRES_USER: signaldesk\n\
            \      POSTGRES_DB: signaldesk\n    volumes: [./postgres:/var/lib/postgresql/data]\n\
            \    healthcheck:\n      test: [CMD-SHELL, pg_isready -U signaldesk]\n\
            \      interval: 5s\n      retries: 20\n    restart: unless-stopped\n\
            \    mem_limit: 256m\n  caddy:\n    image: caddy:2-alpine\n    ports:\
            \ ['80:80', '443:443']\n    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro',\
            \ './caddy:/data']\n    depends_on: [app]\n    restart: unless-stopped\n\
            \    mem_limit: 64m\nCOMPOSE\n/usr/local/bin/docker-compose up -d\n"
      Tags:
      - Key: Name
        Value: signaldesk
Outputs:
  Url:
    Value:
      Fn::Sub: https://${Domain}
  PublicIp:
    Value:
      Fn::GetAtt:
      - Instance
      - PublicIp
  InstanceId:
    Value:
      Ref: Instance
  RetainedDataVolume:
    Value:
      Ref: DataVolume
