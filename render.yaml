# Render Blueprint is not direct Docker Compose deployment.
# No account or resource is provisioned merely by committing this file.
services:
  - type: web
    name: signaldesk
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeployTrigger: 'off'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signaldesk-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
databases:
  - name: signaldesk-db
    plan: free
    databaseName: signaldesk
    user: signaldesk
