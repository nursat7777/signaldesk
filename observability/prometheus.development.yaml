global:
  external_labels:
    deployment_environment_name: development
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yaml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: signaldesk
    static_configs:
      - targets: [collector:8889]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: application-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://app:8000/api/health]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox:9115
