groups:
  - name: signaldesk
    rules:
      - alert: HighErrorRate
        expr: sum(rate(signaldesk_http_requests_total{http_response_status_code=~"5.."}[5m])) / clamp_min(sum(rate(signaldesk_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'More than 5% of requests fail'}
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(signaldesk_http_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'Application p95 latency exceeds one second'}
      - alert: ApplicationUnavailable
        expr: probe_success{job="application-health"} == 0 or absent(probe_success{job="application-health"})
        for: 2m
        labels: {severity: critical}
        annotations: {summary: 'Application health check unavailable'}
      - alert: DatabaseUnavailable
        expr: pg_up == 0 or absent(pg_up)
        for: 2m
        labels: {severity: critical}
        annotations: {summary: 'PostgreSQL exporter cannot reach database'}
      - alert: HighMemory
        expr: signaldesk_process_memory_bytes > 429496729.6
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'Application resident memory exceeds 80% of 512 MiB limit'}
      - alert: BusinessOperationFailures
        expr: sum(increase(signaldesk_business_failures_total[10m])) > 5
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'More than five business operations failed in ten minutes'}
